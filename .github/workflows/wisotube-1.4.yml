      - name: Build signed minified release APK (no emulator tests)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease --console=plain
      - name: Verify and prepare installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo 'APK not produced'; exit 1; }
          test -s "$APK" || { echo 'Empty APK'; exit 1; }
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
