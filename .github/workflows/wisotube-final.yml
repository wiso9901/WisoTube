      - name: Build compressed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk/release -type f -name '*.apk' -print
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo 'Build did not produce an APK' >&2
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if ! "$APKSIGNER" verify "$APK"; then
            echo 'APK is not signed; no installable result can be delivered.' >&2
            exit 1
          fi
          cp "$APK" dist/WisoTube-1.1.apk
          du -h dist/WisoTube-1.1.apk
      - name: Downloadable WisoTube 1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: WisoTube-1.1-APK
          path: dist/WisoTube-1.1.apk
          if-no-files-found: error
