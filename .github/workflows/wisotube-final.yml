name: Build WisoTube 1.1 APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wisotube-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out WisTube source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Apply WisoTube 1.1 changes
        shell: bash
