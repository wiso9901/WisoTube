      - name: Build signed size-optimized release APK (no emulator tests)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Prepare WisoTube APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk" && test -s "$apk"
          cp "$apk" dist/WisoTube-1.2-Lite.apk
          echo "APK size: $(du -h dist/WisoTube-1.2-Lite.apk | cut -f1)"
          if command -v apksigner >/dev/null 2>&1; then apksigner verify dist/WisoTube-1.2-Lite.apk; fi
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: WisoTube-1.2-Lite-APK
          path: dist/WisoTube-1.2-Lite.apk
          retention-days: 14
          if-no-files-found: error
