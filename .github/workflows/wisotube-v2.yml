name: Build WisoTube 1.2 Lite APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wisotube-v2.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out WisTube
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
