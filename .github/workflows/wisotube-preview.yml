      - name: Build compressed release APK (no device tests)
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleRelease
      - name: Show APK size and verify signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          du -h "$APK"
          find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs -r -I '{}' '{}' verify "$APK"
      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: WisoTube-preview-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
